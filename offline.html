<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're Offline</title>

<!-- This page should never appear in search results — it's a fallback,
     not real content, and it has no canonical URL of its own. -->
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="offline.css">
</head>
<body>

  <div class="offline-stage">

    <h1 class="offline-heading">You are offline</h1>

    <div class="offline-canvas-wrap">
      <canvas id="signal-runner" aria-label="Pixel Breaker: an offline mini-game. Use arrow keys or drag to move the paddle and keep the ball alive, breaking the offline message one pixel at a time."></canvas>

      <div id="game-over-screen" class="game-over-overlay" hidden>
        <p id="game-over-title" class="game-over-title">You lost!</p>
        <button type="button" id="overlay-restart-btn" class="offline-btn offline-btn--primary">Start again</button>
      </div>
    </div>

    <button type="button" id="floor-try-again-btn" class="offline-floor-btn">Try again</button>

  </div>

<script src="offline-game.js" defer></script>
</body>
</html>
